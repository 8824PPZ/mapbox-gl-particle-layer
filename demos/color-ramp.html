<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Color ramps · wind particles</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="map"></div>

    <div class="panel">
      <h1>Color ramps &amp; density</h1>
      <p class="meta">
        <span class="stat" id="count">—</span> particles · <span class="stat" id="fps">—</span> fps
      </p>

      <div class="row">
        <label for="ramp">Ramp</label>
        <select id="ramp">
          <option value="wind" selected>wind</option>
          <option value="viridis">viridis</option>
          <option value="plasma">plasma</option>
          <option value="thermal">thermal</option>
          <option value="mono">mono</option>
        </select>
      </div>

      <div class="row">
        <label for="particles">Particles</label>
        <input id="particles" type="range" min="4096" max="131072" step="4096" value="32768" />
        <output id="particles-out">32 768</output>
      </div>

      <div class="row">
        <label for="size">Size</label>
        <input id="size" type="range" min="1" max="6" step="0.1" value="2.2" />
        <output id="size-out">2.2</output>
      </div>

      <div class="row">
        <label for="trail">Trail</label>
        <input id="trail" type="range" min="0.5" max="1" step="0.01" value="1" />
        <output id="trail-out">off</output>
      </div>

      <div class="row">
        <label for="speed">Speed</label>
        <input id="speed" type="range" min="0.2" max="3" step="0.1" value="1" />
        <output id="speed-out">1.0×</output>
      </div>

      <div class="nav">
        <a href="./maplibre.html">Basic</a>
        <a href="./basic.html">Mapbox</a>
        <a href="./viewport-constrained.html">Viewport mode</a>
        <a href="../index.html">All demos</a>
      </div>
    </div>

    <script type="module" src="./color-ramp.js"></script>
  </body>
</html>
